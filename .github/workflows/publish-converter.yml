name: Publish verified converter executable
on:
  push:
    branches: [main]
    paths: ['converter-release-incoming/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify release
        run: |
          cat converter-release-incoming/part-* > converter/PDF_to_QBO_Converter.exe
          echo '1766df5fee5326faf44aa389d65b4f1d502a884478c6383bf380caaa22244709  converter/PDF_to_QBO_Converter.exe' | sha256sum --check
          test "$(stat -c%s converter/PDF_to_QBO_Converter.exe)" = 97814913
          cp converter-release-incoming/latest.json converter/latest.json
          git rm converter-release-incoming/part-* converter-release-incoming/latest.json
          git add converter/PDF_to_QBO_Converter.exe converter/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish PDF to QBO Converter 3.0.2'
          git push origin HEAD:main
