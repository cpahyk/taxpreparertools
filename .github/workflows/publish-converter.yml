name: Publish verified converter executable
on:
  push:
    branches: [main]
    paths: ['converter-release-incoming/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify release
        run: |
          cat converter-release-incoming/part-* > converter/PDF_to_QBO_Converter.exe
          echo 'f0976c69beca4617dad988a39aaf54de43762fd7d8c874f9d527ee57afa1cd44  converter/PDF_to_QBO_Converter.exe' | sha256sum --check
          test "$(stat -c%s converter/PDF_to_QBO_Converter.exe)" = 97812883
          cp converter-release-incoming/latest.json converter/latest.json
          git rm converter-release-incoming/part-* converter-release-incoming/latest.json
          git add converter/PDF_to_QBO_Converter.exe converter/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish PDF to QBO Converter 3.0.0'
          git push origin HEAD:main
