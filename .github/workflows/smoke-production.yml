name: Smoke test production

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/' -o /tmp/home.html

          grep -q 'quickTaxYear' /tmp/home.html
          grep -q '54 Tax Tools, All in One Place' /tmp/home.html
          grep -q '2026–2027 Calendar' /tmp/home.html
          grep -q 'professional-light.css' /tmp/home.html

      - name: Verify shared theme asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/professional-light.css' -o /tmp/theme.css

          grep -q 'Professional Light Theme' /tmp/theme.css
          grep -q '#155fa0' /tmp/theme.css

      - name: Verify key public pages
        shell: bash
        run: |
          set -euo pipefail
          for path in tools.html federal-tax-estimator.html deadlines.html resources.html ai-assistant.html; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
              --header 'Cache-Control: no-cache' \
              "https://www.taxpreparertools.com/$path" -o "/tmp/$path"
            grep -q 'professional-light.css' "/tmp/$path"
          done

          grep -q '@supabase/supabase-js@2.117.2/dist/umd/supabase.js' /tmp/ai-assistant.html

      - name: Verify auth pages production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/login.html' -o /tmp/login.html
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/signup.html' -o /tmp/signup.html
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/forgot-password.html' -o /tmp/forgot-password.html

          grep -q '<form class="auth-form" id="loginForm"' /tmp/login.html
          grep -q 'autocomplete="username"' /tmp/login.html
          grep -q 'autocomplete="current-password"' /tmp/login.html
          grep -q "event === 'PASSWORD_RECOVERY'" /tmp/login.html
          grep -q "updateUser({ password:" /tmp/login.html
          grep -q "signInWithProvider('google')" /tmp/login.html
          grep -q "signInWithProvider('azure', 'email')" /tmp/login.html
          grep -q "/auth/v1/settings" /tmp/login.html
          grep -q 'id="googleLoginBtn"' /tmp/login.html
          grep -q 'id="microsoftLoginBtn"' /tmp/login.html
          grep -q '<form id="signupForm"' /tmp/signup.html
          grep -q 'autocomplete="new-password"' /tmp/signup.html
          grep -q "signInWithProvider('google')" /tmp/signup.html
          grep -q "signInWithProvider('azure', 'email')" /tmp/signup.html
          grep -q "/auth/v1/settings" /tmp/signup.html
          grep -q 'id="googleSignupBtn"' /tmp/signup.html
          grep -q 'id="microsoftSignupBtn"' /tmp/signup.html
          grep -q '<form id="formSection"' /tmp/forgot-password.html
          grep -q 'name="email"' /tmp/forgot-password.html
          grep -q '@supabase/supabase-js@2.117.2/dist/umd/supabase.js' /tmp/login.html
          grep -q '@supabase/supabase-js@2.117.2/dist/umd/supabase.js' /tmp/signup.html
          grep -q '@supabase/supabase-js@2.117.2/dist/umd/supabase.js' /tmp/forgot-password.html

          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/dashboard.html' -o /tmp/dashboard.html
          grep -q 'class="auth-pending dashboard-page"' /tmp/dashboard.html
          grep -q 'id="authGate"' /tmp/dashboard.html
          grep -q '@supabase/supabase-js@2.117.2/dist/umd/supabase.js' /tmp/dashboard.html
          grep -q "window.location.replace('login.html')" /tmp/dashboard.html
          grep -q "fallbackFirst" /tmp/dashboard.html
          grep -q "Profile initialization warning" /tmp/dashboard.html
          grep -q 'id="currentDateLabel"' /tmp/dashboard.html
          grep -q 'id="dashboardSearch"' /tmp/dashboard.html
          grep -q 'function searchDashboardTools' /tmp/dashboard.html
          grep -q 'id="mobileMenuBtn"' /tmp/dashboard.html
          grep -q 'function openSidebar' /tmp/dashboard.html
          grep -q 'No saved calculations yet' /tmp/dashboard.html
          grep -q 'Recommended Tools' /tmp/dashboard.html
          grep -q 'id="recentToolsList"' /tmp/dashboard.html
          grep -q "RECENT_TOOLS_KEY = 'tpt_recent_tools_v1'" /tmp/dashboard.html
          grep -q 'function renderRecentTools' /tmp/dashboard.html
          grep -q 'function isSafeRecentToolUrl' /tmp/dashboard.html
          grep -q 'function formatRecentVisit' /tmp/dashboard.html
          grep -q 'function clearRecentTools' /tmp/dashboard.html
          grep -q 'id="accountSecurity"' /tmp/dashboard.html
          grep -q 'id="accountEmail"' /tmp/dashboard.html
          grep -q 'id="accountEmailStatus"' /tmp/dashboard.html
          grep -q 'id="accountProvider"' /tmp/dashboard.html
          grep -q 'id="accountLastSignIn"' /tmp/dashboard.html
          grep -q 'user.email_confirmed_at' /tmp/dashboard.html
          grep -q 'user.last_sign_in_at' /tmp/dashboard.html
          grep -q 'id="authGateRetry"' /tmp/dashboard.html
          grep -q 'function showAuthGateError' /tmp/dashboard.html
          grep -q "Session check timed out" /tmp/dashboard.html
          grep -q "window.supabase ?" /tmp/dashboard.html
          grep -q 'class="auth-pending dashboard-page"' /tmp/dashboard.html
          grep -q '.dashboard-page .topbar' /tmp/dashboard.html
          grep -q '<main class="main-content" id="dashboardMain"' /tmp/dashboard.html
          grep -q 'class="skip-link"' /tmp/dashboard.html
          grep -q 'aria-current="page"' /tmp/dashboard.html
          grep -q 'aria-label="Ask AI Tax Assistant"' /tmp/dashboard.html
          grep -q 'id="dashboardDeadlines"' /tmp/dashboard.html
          grep -q 'function renderDashboardDeadlines' /tmp/dashboard.html
          grep -q "event === 'SIGNED_OUT'" /tmp/dashboard.html
          grep -q "button.textContent = 'Signing out…'" /tmp/dashboard.html
          grep -q "date:'2026-10-15'" /tmp/dashboard.html
          if grep -q '<div class="dl-d">15</div><div class="dl-m">Jun</div>' /tmp/dashboard.html; then
            echo 'Dashboard still contains stale June deadline markup' >&2
            exit 1
          fi
          if grep -q 'Sunday, May 3, 2026' /tmp/dashboard.html; then
            echo 'Dashboard still contains stale hard-coded date' >&2
            exit 1
          fi
          grep -q "new URLSearchParams(window.location.search).get('search')" /tmp/tools.html
          grep -q "RECENT_TOOLS_KEY = 'tpt_recent_tools_v1'" /tmp/tools.html
          grep -q 'function recordRecentToolFromCard' /tmp/tools.html
          grep -q 'function isSafeRecentToolUrl' /tmp/tools.html

      - name: Verify property tax search production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/property-tax-search.html' -o /tmp/property-tax.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/assets/js/property-tax-data.js' -o /tmp/property-tax-data.js

          grep -q 'US Property Tax &amp;<br>Assessor Search' /tmp/property-tax.html
          grep -q 'src="/assets/js/property-tax-data.js?v=' /tmp/property-tax.html
          grep -q 'ZIP matches are approximate' /tmp/property-tax.html
          grep -q 'aria-activedescendant' /tmp/property-tax.html
          grep -q "classList.toggle('kbd-focus'" /tmp/property-tax.html
          grep -q 'function normalizeJurisdiction' /tmp/property-tax.html
          grep -q 'baseMatches.length===1' /tmp/property-tax.html
          grep -q 'findCountyItem(out.county, out.abbr)' /tmp/property-tax.html
          grep -q "typeof data.matchJurisdiction === 'function'" /tmp/property-tax.html
          grep -q 'function matchJurisdiction' /tmp/property-tax-data.js
          grep -q 'function lookupCountyFromCoordinates' /tmp/property-tax.html
          grep -q '/api/census/block/find?latitude=' /tmp/property-tax.html
          grep -q 'function lookupCountyViaCensusJsonp' /tmp/property-tax.html
          grep -q 'function inferCountyFromPlace' /tmp/property-tax.html
          grep -q 'function geocodeAddressViaCensusJsonp' /tmp/property-tax.html
          grep -q '/geocoder/geographies/onelineaddress' /tmp/property-tax.html
          grep -q 'function lookupZipJurisdiction' /tmp/property-tax.html
          grep -q 'var bareZip=' /tmp/property-tax.html
          grep -q 'ZIP will be used only as a fallback' /tmp/property-tax.html
          grep -q 'task=geocodeAddressViaCensusJsonp(raw)' /tmp/property-tax.html
          grep -q 'return lookupZipJurisdiction(fallbackZip)' /tmp/property-tax.html
          grep -q "fetchJsonWithTimeout('https://api.zippopotam.us/us/'+encodeURIComponent(zip),5000)" /tmp/property-tax.html
          grep -q 'var resolveSequence = 0' /tmp/property-tax.html
          grep -q 'propertytax:reset' /tmp/property-tax.html
          grep -q 'sequence!==resolveSequence' /tmp/property-tax.html
          grep -q 'sequence===resolveSequence' /tmp/property-tax.html
          grep -q "source:'address'" /tmp/property-tax.html
          grep -q 'function applyResolvedJurisdiction' /tmp/property-tax.html
          grep -q 'var detectedFallback = {' /tmp/property-tax.html
          grep -q 'No curated direct portal is listed yet' /tmp/property-tax.html
          grep -q 'matchSource: "shared"' /tmp/property-tax.html
          grep -q 'matchSource: "detected"' /tmp/property-tax.html
          grep -q 'CURATED DIRECT DESTINATION' /tmp/property-tax.html
          grep -q 'DETECTED JURISDICTION · SEARCH FALLBACK' /tmp/property-tax.html
          grep -q "getJurisdictionNoun(out.abbr) === 'local area'" /tmp/property-tax.html
          grep -q 'Detected local area:' /tmp/property-tax.html
          grep -q 'Property assessment is generally municipal here' /tmp/property-tax.html
          grep -q 'id="btnResetSearch"' /tmp/property-tax.html
          grep -q 'Reset all search state' /tmp/property-tax.html
          grep -q "history.replaceState(null, '', window.location.pathname)" /tmp/property-tax.html
          grep -q 'function createSearchFallback' /tmp/property-tax.html
          grep -q 'routeType: "search"' /tmp/property-tax.html
          grep -q 'matchSource: source || "manual"' /tmp/property-tax.html
          grep -q "countyFallbackOption" /tmp/property-tax.html
          grep -q 'Unlisted area' /tmp/property-tax.html
          grep -q 'Choose a state first' /tmp/property-tax.html
          grep -q 'Type an unlisted county, city, parish, borough, or town' /tmp/property-tax.html
          ! grep -Eq '\b(alert|prompt)\s*\(' /tmp/property-tax.html
          grep -q "items.length === 1" /tmp/property-tax.html
          grep -q 'counties.length === 0' /tmp/property-tax.html
          grep -q 'listed match' /tmp/property-tax.html
          grep -q 'No listed match' /tmp/property-tax.html
          grep -q 'id="countyCount" role="status" aria-live="polite"' /tmp/property-tax.html
          grep -q 'aria-describedby="countyCount"' /tmp/property-tax.html
          grep -q "e.target.closest('#step2')" /tmp/property-tax.html
          grep -q 'class="pt-zip-box"' /tmp/property-tax.html
          grep -q 'class="pt-related-card"' /tmp/property-tax.html
          grep -q 'class="pt-faq-card"' /tmp/property-tax.html
          grep -q "kind==='err' ? 'var(--red)'" /tmp/property-tax.html
          grep -q "kind==='ok' ? 'var(--green)'" /tmp/property-tax.html
          ! grep -q '.big-select option { background-color:#0f1d38' /tmp/property-tax.html
          ! grep -q 'color:#0a1628' /tmp/property-tax.html
          grep -q 'routeType: "search"' /tmp/property-tax.html
          grep -q 'function normalizeAreaFilter' /tmp/property-tax.html
          grep -q "e.key === 'Home'" /tmp/property-tax.html
          grep -q "e.key === 'End'" /tmp/property-tax.html
          grep -q "county.routeType === 'search'" /tmp/property-tax-data.js
          grep -q '{ name:"Cook",       portal:"https://www.cookcountypropertyinfo.com/"' /tmp/property-tax-data.js
          ! grep -q '{ name:"Cook",       portal:"https://www.cookcountyassessor.com/advanced-search"' /tmp/property-tax-data.js
          grep -q '{ name:"Tippecanoe", portal:"https://www.tippecanoe.in.gov/150/Assessor"' /tmp/property-tax-data.js
          ! grep -q 'https://www.tippecanoe.in.gov/137/Assessor' /tmp/property-tax-data.js
          grep -q '{ name:"Manatee",     portal:"https://www.manateepao.gov/"' /tmp/property-tax-data.js
          ! grep -q '{ name:"Manatee",     portal:"https://www.manateepao.gov/search/"' /tmp/property-tax-data.js
          grep -q 'function getJurisdictionLabel' /tmp/property-tax-data.js
          grep -q 'UNIQUE_DIRECT_PORTAL_COUNT' /tmp/property-tax-data.js
          if grep -q 'portal:"http://' /tmp/property-tax-data.js; then
            echo 'Property tax production data still contains insecure HTTP portal data.'
            exit 1
          fi
