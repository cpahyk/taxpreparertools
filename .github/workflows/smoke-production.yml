name: Smoke test production

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/' -o /tmp/home.html

          grep -q 'quickTaxYear' /tmp/home.html
          grep -q '54 Tax Tools, All in One Place' /tmp/home.html
          grep -q '2026–2027 Calendar' /tmp/home.html
          grep -q 'professional-light.css' /tmp/home.html

      - name: Verify shared theme asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/professional-light.css' -o /tmp/theme.css

          grep -q 'Professional Light Theme' /tmp/theme.css
          grep -q '#155fa0' /tmp/theme.css

      - name: Verify key public pages
        shell: bash
        run: |
          set -euo pipefail
          for path in tools.html federal-tax-estimator.html deadlines.html resources.html; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
              --header 'Cache-Control: no-cache' \
              "https://www.taxpreparertools.com/$path" -o "/tmp/$path"
            grep -q 'professional-light.css' "/tmp/$path"
          done
