name: Smoke test production

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/' -o /tmp/home.html

          grep -q 'quickTaxYear' /tmp/home.html
          grep -q '54 Tax Tools, All in One Place' /tmp/home.html
          grep -q '2026–2027 Calendar' /tmp/home.html
          grep -q 'professional-light.css' /tmp/home.html

      - name: Verify shared theme asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/professional-light.css' -o /tmp/theme.css

          grep -q 'Professional Light Theme' /tmp/theme.css
          grep -q '#155fa0' /tmp/theme.css

      - name: Verify key public pages
        shell: bash
        run: |
          set -euo pipefail
          for path in tools.html federal-tax-estimator.html deadlines.html resources.html; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 3 \
              --header 'Cache-Control: no-cache' \
              "https://www.taxpreparertools.com/$path" -o "/tmp/$path"
            grep -q 'professional-light.css' "/tmp/$path"
          done


      - name: Verify property tax search production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/property-tax-search.html' -o /tmp/property-tax.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 4 \
            --header 'Cache-Control: no-cache' \
            'https://www.taxpreparertools.com/assets/js/property-tax-data.js' -o /tmp/property-tax-data.js

          grep -q 'US Property Tax &amp;<br>Assessor Search' /tmp/property-tax.html
          grep -q 'src="/assets/js/property-tax-data.js?v=' /tmp/property-tax.html
          grep -q 'ZIP matches are approximate' /tmp/property-tax.html
          grep -q 'aria-activedescendant' /tmp/property-tax.html
          grep -q "classList.toggle('kbd-focus'" /tmp/property-tax.html
          grep -q 'function normalizeJurisdiction' /tmp/property-tax.html
          grep -q 'baseMatches.length===1' /tmp/property-tax.html
          grep -q 'findCountyItem(out.county, out.abbr)' /tmp/property-tax.html
          grep -q 'function lookupCountyFromCoordinates' /tmp/property-tax.html
          grep -q '/api/census/block/find?latitude=' /tmp/property-tax.html
          grep -q 'function lookupCountyViaCensusJsonp' /tmp/property-tax.html
          grep -q 'function inferCountyFromPlace' /tmp/property-tax.html
          grep -q 'function geocodeAddressViaCensusJsonp' /tmp/property-tax.html
          grep -q '/geocoder/geographies/onelineaddress' /tmp/property-tax.html
          grep -q 'function lookupZipJurisdiction' /tmp/property-tax.html
          grep -q 'var bareZip=' /tmp/property-tax.html
          grep -q 'ZIP will be used only as a fallback' /tmp/property-tax.html
          grep -q 'task=geocodeAddressViaCensusJsonp(raw)' /tmp/property-tax.html
          grep -q 'return lookupZipJurisdiction(fallbackZip)' /tmp/property-tax.html
          grep -q "fetchJsonWithTimeout('https://api.zippopotam.us/us/'+encodeURIComponent(zip),5000)" /tmp/property-tax.html
          grep -q 'var resolveSequence = 0' /tmp/property-tax.html
          grep -q 'propertytax:reset' /tmp/property-tax.html
          grep -q 'sequence!==resolveSequence' /tmp/property-tax.html
          grep -q 'sequence===resolveSequence' /tmp/property-tax.html
          grep -q "source:'address'" /tmp/property-tax.html
          grep -q 'function applyResolvedJurisdiction' /tmp/property-tax.html
          grep -q 'var detectedFallback = {' /tmp/property-tax.html
          grep -q 'No curated direct portal is listed yet' /tmp/property-tax.html
          grep -q 'matchSource: "shared"' /tmp/property-tax.html
          grep -q 'matchSource: "detected"' /tmp/property-tax.html
          grep -q 'CURATED DIRECT DESTINATION' /tmp/property-tax.html
          grep -q 'DETECTED JURISDICTION · SEARCH FALLBACK' /tmp/property-tax.html
          grep -q "getJurisdictionNoun(out.abbr) === 'local area'" /tmp/property-tax.html
          grep -q 'Detected local area:' /tmp/property-tax.html
          grep -q 'Property assessment is generally municipal here' /tmp/property-tax.html
          grep -q 'id="btnResetSearch"' /tmp/property-tax.html
          grep -q 'Reset all search state' /tmp/property-tax.html
          grep -q "history.replaceState(null, '', window.location.pathname)" /tmp/property-tax.html
          grep -q 'function createSearchFallback' /tmp/property-tax.html
          grep -q 'routeType: "search"' /tmp/property-tax.html
          grep -q 'matchSource: source || "manual"' /tmp/property-tax.html
          grep -q "countyFallbackOption" /tmp/property-tax.html
          grep -q 'Unlisted area' /tmp/property-tax.html
          grep -q "items.length === 1" /tmp/property-tax.html
          grep -q 'counties.length === 0' /tmp/property-tax.html
          grep -q 'listed match' /tmp/property-tax.html
          grep -q 'No listed match' /tmp/property-tax.html
          grep -q 'id="countyCount" role="status" aria-live="polite"' /tmp/property-tax.html
          grep -q 'aria-describedby="countyCount"' /tmp/property-tax.html
          grep -q "e.target.closest('#step2')" /tmp/property-tax.html
          grep -q 'class="pt-zip-box"' /tmp/property-tax.html
          grep -q 'class="pt-related-card"' /tmp/property-tax.html
          grep -q 'class="pt-faq-card"' /tmp/property-tax.html
          grep -q "kind==='err' ? 'var(--red)'" /tmp/property-tax.html
          grep -q "kind==='ok' ? 'var(--green)'" /tmp/property-tax.html
          ! grep -q '.big-select option { background-color:#0f1d38' /tmp/property-tax.html
          ! grep -q 'color:#0a1628' /tmp/property-tax.html
          grep -q 'routeType: "search"' /tmp/property-tax.html
          grep -q 'function normalizeAreaFilter' /tmp/property-tax.html
          grep -q "e.key === 'Home'" /tmp/property-tax.html
          grep -q "e.key === 'End'" /tmp/property-tax.html
          grep -q "county.routeType === 'search'" /tmp/property-tax-data.js
          grep -q '{ name:"Cook",       portal:"https://www.cookcountypropertyinfo.com/"' /tmp/property-tax-data.js
          ! grep -q '{ name:"Cook",       portal:"https://www.cookcountyassessor.com/advanced-search"' /tmp/property-tax-data.js
          grep -q 'function getJurisdictionLabel' /tmp/property-tax-data.js
          grep -q 'UNIQUE_DIRECT_PORTAL_COUNT' /tmp/property-tax-data.js
          if grep -q 'portal:"http://' /tmp/property-tax-data.js; then
            echo 'Property tax production data still contains insecure HTTP portal data.'
            exit 1
          fi
