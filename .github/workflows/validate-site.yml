name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML, scripts and links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate maintenance scripts
        shell: bash
        run: |
          node --check scripts/audit-property-tax-links.cjs
          test -f .github/workflows/property-tax-link-audit.yml
          echo "Validated property-tax maintenance automation."

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === '.git' || entry.name === '.wrangler' || entry.name === 'node_modules') return [];
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const htmlFiles = walk('.').filter(file => file.endsWith('.html'));
          const failures = [];

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const scriptRe = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
            let match;
            let index = 0;

            while ((match = scriptRe.exec(html))) {
              const attrs = match[1] || '';
              const code = match[2] || '';
              const isJsonLd = /type\s*=\s*["']application\/ld\+json["']/i.test(attrs);
              const isExternal = /src\s*=/i.test(attrs);
              if (isJsonLd || isExternal || !code.trim()) {
                index++;
                continue;
              }

              try {
                new Function(code);
              } catch (error) {
                failures.push(`${file}: inline script #${index + 1}: ${error.message}`);
              }
              index++;
            }
          }

          if (failures.length) {
            console.error('JavaScript syntax validation failed:');
            failures.forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log(`Validated inline JavaScript syntax in ${htmlFiles.length} HTML files.`);
          NODE

      - name: Validate JSON-LD blocks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === '.git' || entry.name === '.wrangler' || entry.name === 'node_modules') return [];
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const htmlFiles = walk('.').filter(file => file.endsWith('.html'));
          const failures = [];

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)];

            blocks.forEach((match, index) => {
              try {
                JSON.parse(match[1].trim());
              } catch (error) {
                failures.push(`${file}: JSON-LD block #${index + 1}: ${error.message}`);
              }
            });
          }

          if (failures.length) {
            console.error('JSON-LD validation failed:');
            failures.forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log(`Validated JSON-LD in ${htmlFiles.length} HTML files.`);
          NODE

      - name: Validate sitemap SEO metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          const failures = [];

          for (const url of urls) {
            const pathname = new URL(url).pathname;
            let file;
            if (pathname === '/') file = 'index.html';
            else if (pathname.endsWith('/')) file = pathname.slice(1) + 'index.html';
            else file = pathname.slice(1) + '.html';

            if (!fs.existsSync(file)) continue;

            const html = fs.readFileSync(file, 'utf8');
            const title = html.match(/<title>([\s\S]*?)<\/title>/i)?.[1]?.trim();
            const description = html.match(/<meta\s+name=["']description["']\s+content=["']([^"']+)["']/i)?.[1]?.trim();
            const canonical = html.match(/<link\s+rel=["']canonical["']\s+href=["']([^"']+)["']/i)?.[1]?.trim();

            if (!title) failures.push(`${file}: missing <title>`);
            if (!description) failures.push(`${file}: missing meta description`);
            if (!canonical) failures.push(`${file}: missing canonical URL`);
          }

          if (failures.length) {
            console.error('Sitemap SEO metadata validation failed:');
            failures.forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log(`Validated SEO metadata on ${urls.length} sitemap pages.`);
          NODE

      - name: Verify sitemap pages use the professional theme
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          const missingFiles = [];
          const missingTheme = [];

          for (const url of urls) {
            const pathname = new URL(url).pathname;
            let file;
            if (pathname === '/') file = 'index.html';
            else if (pathname.endsWith('/')) file = pathname.slice(1) + 'index.html';
            else file = pathname.slice(1) + '.html';

            if (!fs.existsSync(file)) {
              missingFiles.push(file);
              continue;
            }

            const html = fs.readFileSync(file, 'utf8');
            if (!html.includes('professional-light.css')) {
              missingTheme.push(file);
            }
          }

          if (missingFiles.length || missingTheme.length) {
            if (missingFiles.length) {
              console.error('Sitemap targets without a matching HTML file:');
              missingFiles.forEach(f => console.error(' - ' + f));
            }
            if (missingTheme.length) {
              console.error('Sitemap pages missing professional-light.css:');
              missingTheme.forEach(f => console.error(' - ' + f));
            }
            process.exit(1);
          }

          console.log(`Verified theme coverage for ${urls.length} sitemap URLs.`);
          NODE

      - name: Verify all user-facing HTML uses the professional theme
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === '.git' || entry.name === '.wrangler' || entry.name === 'node_modules') return [];
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const excluded = new Set(['fo-verify.html']);
          const htmlFiles = walk('.').filter(file => file.endsWith('.html') && !excluded.has(file));
          const missing = htmlFiles.filter(file => !fs.readFileSync(file, 'utf8').includes('professional-light.css'));

          if (missing.length) {
            console.error('User-facing HTML files missing professional-light.css:');
            missing.forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log(`Verified professional theme on ${htmlFiles.length} user-facing HTML files.`);
          NODE

      - name: Check internal HTML links
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              if (entry.name === '.git' || entry.name === '.wrangler' || entry.name === 'node_modules') return [];
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const htmlFiles = walk('.').filter(file => file.endsWith('.html'));
          const failures = [];

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const hrefs = [...html.matchAll(/href\s*=\s*["']([^"'#?]+\.html)(?:[#?][^"']*)?["']/gi)].map(m => m[1]);

            for (const href of hrefs) {
              if (href.includes('${')) continue;
              if (/^(?:https?:|mailto:|tel:)/i.test(href)) continue;
              const target = href.startsWith('/')
                ? href.slice(1)
                : path.normalize(path.join(path.dirname(file), href));

              if (!fs.existsSync(target)) {
                failures.push(`${file} -> ${href}`);
              }
            }
          }

          if (failures.length) {
            console.error('Broken internal HTML links:');
            [...new Set(failures)].forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log('Internal .html links resolve to repository files.');
          NODE

      - name: Validate tools directory integrity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('tools.html', 'utf8');

          if (html.includes('},,')) {
            throw new Error('tools.html contains a double-comma array syntax error.');
          }

          const block = html.match(/const ALL_TOOLS = \[([\s\S]*?)\];\s*let currentCat/);
          if (!block) throw new Error('Could not locate ALL_TOOLS data.');

          const names = [...block[1].matchAll(/name:"([^"]+)"/g)].map(m => m[1]);
          const duplicates = names.filter((name, index) => names.indexOf(name) !== index);

          if (duplicates.length) {
            throw new Error('Duplicate tool names: ' + [...new Set(duplicates)].join(', '));
          }

          console.log(`Tools directory integrity passed with ${names.length} unique tools.`);
          NODE

      - name: Validate property tax directory data
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('property-tax-search.html', 'utf8');
          const data = fs.readFileSync('assets/js/property-tax-data.js', 'utf8');

          const stateDefs = [...data.matchAll(/\{ code:"([A-Z]{2})", name:"([^"]+)" \}/g)];
          const stateCodes = stateDefs.map(m => m[1]);
          const uniqueStates = new Set(stateCodes);
          const failures = [];

          if (stateCodes.length !== 51 || uniqueStates.size !== 51) {
            failures.push(`Expected 51 unique state/DC entries; found ${stateCodes.length} rows / ${uniqueStates.size} unique.`);
          }

          if (!html.includes('src="/assets/js/property-tax-data.js?v=')) {
            failures.push('property-tax-search.html must load the shared property-tax data file.');
          }
          if (html.includes('const COUNTY_PORTALS = {')) {
            failures.push('property-tax-search.html must not contain a second inline COUNTY_PORTALS copy.');
          }

          const start = data.indexOf('const COUNTY_PORTALS = {');
          const end = data.indexOf('\n};', start);
          if (start < 0 || end < 0) {
            failures.push('Could not locate COUNTY_PORTALS data.');
          } else {
            const block = data.slice(start, end + 3);
            const stateBlocks = [...block.matchAll(/\n\s{2}([A-Z]{2}):\s*\[([\s\S]*?)\n\s{2}\](?:,|\n)/g)];
            if (stateBlocks.length !== 51) failures.push(`Expected 51 COUNTY_PORTALS blocks; found ${stateBlocks.length}.`);

            let total = 0;
            let direct = 0;
            const uniqueDirect = new Set();

            for (const match of stateBlocks) {
              const code = match[1];
              const body = match[2];
              const entries = [...body.matchAll(/\{\s*name:"([^"]+)"\s*,\s*portal:"([^"]+)"\s*,\s*(?:routeType:"(search)"\s*,\s*)?methods:(ALL|ADDR_PARCEL)[\s\S]*?notes:"([^"]*)"\s*\}/g)];
              total += entries.length;

              const names = new Set();
              for (const entry of entries) {
                const [, name, portal, routeType, methods] = entry;
                const key = name.trim().toLowerCase();

                if (names.has(key)) failures.push(`${code}: duplicate jurisdiction name "${name}".`);
                names.add(key);

                if (!/^https:\/\//i.test(portal)) failures.push(`${code} / ${name}: portal is not HTTPS: ${portal}`);
                const googleSearch = /google\.com\/search/i.test(portal);
                if (googleSearch && routeType !== 'search') {
                  failures.push(`${code} / ${name}: Google search fallback must declare routeType:"search".`);
                }
                if (!googleSearch && routeType === 'search') {
                  failures.push(`${code} / ${name}: routeType:"search" is reserved for explicit search fallback destinations.`);
                }
                if (routeType !== 'search') {
                  direct++;
                  uniqueDirect.add(portal);
                }
                if (!['ALL','ADDR_PARCEL'].includes(methods)) failures.push(`${code} / ${name}: unexpected methods token ${methods}.`);
              }

              const declaredRows = [...body.matchAll(/\{\s*name:"/g)].length;
              if (entries.length !== declaredRows) {
                failures.push(`${code}: parsed ${entries.length} entries but found ${declaredRows} declared rows.`);
              }
            }

            if (total < 300) failures.push(`Expected at least 300 listed jurisdictions; found ${total}.`);
            if (direct < 300) failures.push(`Expected at least 300 direct HTTPS jurisdiction entries; found ${direct}.`);
            if (uniqueDirect.size < 290) failures.push(`Expected at least 290 unique direct HTTPS destinations; found ${uniqueDirect.size}.`);
          }

          const dataMarkers = [
            'function getJurisdictionLabel',
            'function getJurisdictionNoun',
            "county.routeType === 'search'",
            'DIRECT_PORTAL_COUNT',
            'UNIQUE_DIRECT_PORTAL_COUNT',
            'window.PROPERTY_TAX_DATA'
          ];
          for (const marker of dataMarkers) {
            if (!data.includes(marker)) failures.push(`Missing property-tax data marker: ${marker}`);
          }

          // Regression checks for independent-city/county name collisions.
          if (!data.includes("if (/\\b(County|City|Parish|Borough|Municipality|Census Area)$/i.test(n)) return n;")) {
            failures.push('Jurisdiction labels must preserve explicit City/County/Parish/Borough suffixes.');
          }
          if (!data.includes('{ name:"Baltimore County"') || !data.includes('{ name:"Baltimore City"')) {
            failures.push('Baltimore City/County regression fixtures are missing.');
          }
          if (!data.includes('{ name:"St. Louis County"') || !data.includes('{ name:"St. Louis City"')) {
            failures.push('St. Louis City/County regression fixtures are missing.');
          }

          if (!data.includes('{ name:"Polk",        portal:"https://www.polkflpa.gov/CamaSearch.aspx"') || !data.includes('notes:"Lakeland / Winter Haven."')) {
            failures.push('Florida Polk County / Lakeland ZIP fallback fixture is missing.');
          }

          if (!data.includes('{ name:"Cook",       portal:"https://www.cookcountypropertyinfo.com/"')) {
            failures.push('Cook County must use cookcountypropertyinfo.com as the primary property destination.');
          }
          if (data.includes('{ name:"Cook",       portal:"https://www.cookcountyassessor.com/advanced-search"')) {
            failures.push('Cook County reverted to the old Assessor advanced-search primary destination.');
          }

          if (!data.includes('{ name:"Tippecanoe", portal:"https://www.tippecanoe.in.gov/150/Assessor"')) {
            failures.push('Tippecanoe County must use the current official Assessor route.');
          }
          if (data.includes('https://www.tippecanoe.in.gov/137/Assessor')) {
            failures.push('Retired Tippecanoe County Assessor URL returned.');
          }

          const knownStalePropertyTaxUrls = [
            'https://www.mc-ala.org/residents/online-services/property-search',
            'https://www.muni.org/Departments/finance/treasury/PropertyTax/Pages/default.aspx',
            'https://baldwincountyal.gov/government/county-departments/revenue-commission',
            'https://www.fresnocountyca.gov/Departments/Assessor-Recorder',
            'https://www.sjgov.org/department/asr',
            'https://www.countyofsb.org/132/Assessor',
            'https://www.lakecountyil.gov/2854/Property-Tax-Assessment-Information',
            'https://www.wycokck.org/Departments/Appraiser',
            'https://kentonpva.org/property-search/',
            'https://www.oakgov.com/treasurer/Pages/property-tax-info.aspx',
            'https://www.hindscountyms.com/elected-offices/tax-assessor-collector',
            'https://www.jacksongov.org/Residents/Pay-Taxes',
            'https://www.sccmo.org/189/Assessor',
            'https://www.albanycounty.com/government/departments/real-property-tax-service',
            'https://fiscaloffice.summitoh.net/index.php/property-search',
            'https://www.co.lucas.oh.us/167/Auditor',
            'https://www.fbcad.org/property-search/',
            'https://www.arlingtonva.us/Government/Departments/Real-Estate-Assessments',
            'https://www.norfolk.gov/4225/Real-Estate-Search',
            'https://www.rva.gov/finance/real-estate-assessor',
            'https://www.racinecounty.com/government/treasurer/property-tax-information',
            'https://www.laramiecountywy.gov/government/elected-officials/assessor/',
            'https://www.natronacounty-wy.gov/176/Assessor',
            'https://mylandinfo.sbcounty.gov/',
            'https://www.westchestergov.com/property-tax',
            'https://propertytax.newcastlede.gov/',
            'https://www.allencounty.us/assessor',
            'https://www.gallatin.mt.gov/treasurer',
            'https://www.carson.org/government/departments-a-f/assessor',
            'https://www.lehighcounty.org/Departments/Assessment',
            'https://www.co.berks.pa.us/Dept/Assessment/Pages/default.aspx',
            'https://www.assessormelvinburgess.com/propertysearch',
            'https://www3.co.weber.ut.us/assessor/',
            'https://www.vbgov.com/government/departments/assessor',
            'https://pbcpao.gov/Property/Search',
            'https://www.tippecanoe.in.gov/137/Assessor'
          ];
          for (const staleUrl of knownStalePropertyTaxUrls) {
            if (data.includes(staleUrl)) failures.push(`Known stale property-tax URL returned: ${staleUrl}`);
          }

          const htmlMarkers = [
            'ZIP matches are approximate',
            'Expected Search Options',
            'aria-autocomplete="list"',
            'aria-activedescendant',
            "classList.toggle('kbd-focus'",
            'function normalizeJurisdiction',
            'baseMatches.length===1',
            'findCountyItem(out.county, out.abbr)',
            'function lookupCountyFromCoordinates',
            '/api/census/block/find?latitude=',
            'function lookupCountyViaCensusJsonp',
            'format=jsonp',
            'function inferCountyFromPlace',
            'function geocodeAddressViaCensusJsonp',
            '/geocoder/geographies/onelineaddress',
            'function lookupZipJurisdiction',
            'var bareZip=',
            'ZIP will be used only as a fallback',
            'task=geocodeAddressViaCensusJsonp(raw)',
            'return lookupZipJurisdiction(fallbackZip)',
            "fetchJsonWithTimeout('https://api.zippopotam.us/us/'+encodeURIComponent(zip),5000)",
            'var resolveSequence = 0',
            "propertytax:reset",
            'sequence!==resolveSequence',
            'sequence===resolveSequence',
            "source:'address'",
            'function applyResolvedJurisdiction',
            'routeType: "search"',
            'var detectedFallback = {',
            'No curated direct portal is listed yet',
            'matchSource: "shared"',
            'matchSource: "detected"',
            'CURATED DIRECT DESTINATION',
            'DETECTED JURISDICTION · SEARCH FALLBACK',
            "getJurisdictionNoun(out.abbr) === 'local area'",
            'Detected local area:',
            'Property assessment is generally municipal here',
            'id="btnResetSearch"',
            'Reset all search state',
            "history.replaceState(null, '', window.location.pathname)",
            'function createSearchFallback',
            'matchSource: source || "manual"',
            'id = \'countyFallbackOption\'',
            'Unlisted area',
            "items.length === 1",
            'counties.length === 0',
            'listed match',
            'No listed match',
            'id="countyCount" role="status" aria-live="polite"',
            'aria-describedby="countyCount"',
            "e.target.closest('#step2')",
            'class="pt-zip-box"',
            'class="pt-zip-input"',
            'class="pt-related-card"',
            'class="pt-related-tools-card"',
            'class="pt-faq-card"',
            "kind==='err' ? 'var(--red)'",
            "kind==='ok' ? 'var(--green)'",
            'function normalizeAreaFilter',
            "e.key === 'Home'",
            "e.key === 'End'"
          ];
          for (const marker of htmlMarkers) {
            if (!html.includes(marker)) failures.push(`Missing property-tax UI safety marker: ${marker}`);
          }

          const legacyLightThemePatterns = [
            '.big-select option { background-color:#0f1d38',
            'color:#0a1628',
            'background:var(--navy-mid,#122040)',
            "kind==='err' ? '#e8a0a0'",
            "kind==='ok' ? '#9fd5a0'"
          ];
          for (const legacyPattern of legacyLightThemePatterns) {
            if (html.includes(legacyPattern)) failures.push(`Legacy dark-theme property-tax styling returned: ${legacyPattern}`);
          }

          if (failures.length) {
            console.error('Property tax directory validation failed:');
            failures.forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log('Property tax directory integrity passed.');
          NODE

      - name: Validate live tool routes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const html = fs.readFileSync('tools.html', 'utf8');
          const block = html.match(/const ALL_TOOLS = \[([\s\S]*?)\];\s*let currentCat/);
          if (!block) throw new Error('Could not locate ALL_TOOLS data.');

          const objects = [...block[1].matchAll(/\{\s*id:(\d+),([\s\S]*?)\}(?=,\s*(?:\{|\/\/)|\s*$)/g)];
          const failures = [];

          for (const [, id, body] of objects) {
            if (/comingSoon\s*:\s*true/.test(body)) continue;
            const name = (body.match(/name:"([^"]+)"/) || [])[1] || `Tool ${id}`;
            const url = (body.match(/url:"([^"]+)"/) || [])[1];
            if (!url || /^(?:https?:|#)/i.test(url)) continue;

            const target = url.replace(/^\//, '');
            if (!fs.existsSync(target)) {
              failures.push(`${name} -> ${url}`);
            }
          }

          if (failures.length) {
            console.error('Live tool routes missing from repository:');
            failures.forEach(f => console.error(' - ' + f));
            process.exit(1);
          }

          console.log('All live tool routes resolve to repository files.');
          NODE
